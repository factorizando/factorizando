<!doctype html>
<html lang="en">
  <head>
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash,
          );
        }
      })(window.location);
    </script>
    <script>
      // Supabase puede regresar el resultado de un enlace de correo (recuperación,
      // confirmación) en el FRAGMENTO de la URL (#error=… o #access_token=…), que
      // choca con HashRouter y muestra 404. Si el fragmento trae un error de auth,
      // lo mandamos a la pantalla de "enlace no válido" antes de que cargue el router.
      (function (l) {
        var frag = l.hash ? l.hash.slice(1) : "";
        if (frag && frag.charAt(0) !== "/" && /(?:^|&)error=/.test(frag)) {
          window.history.replaceState(null, null, l.pathname + l.search + "#/nueva-contrasena");
        }
      })(window.location);
    </script>
    <meta charset="UTF-8" />
    <!-- El favicon es la variante de avatar de la marca: disco azul con el
         tribar calado. Lleva su propio fondo, así que se lee igual en una
         pestaña clara que en una oscura, cosa que un trazo suelto no logra.
         Es el corte de contraste (caras al 1/.38/.12, no al 1/.55/.3 del
         pliego): sobre azul, el blanco al 30 % se lava por debajo de 32 px.
         La ruta va a ./assets/…, no a /public/assets/…: el contenido de
         public/ se copia a la raíz de dist/, no bajo /public. -->
    <link rel="icon" type="image/svg+xml" href="./assets/marca/v-avatar.svg" />
    <!-- iOS no usa el favicon SVG ni respeta transparencias al poner el
         icono en la pantalla de inicio: compone lo transparente sobre negro.
         Por eso apunta a la variante CUADRADA, que llega a las esquinas.
         El archivo existía desde antes con la marca vieja y no lo enlazaba
         nadie, así que iOS mostraba una captura de la página. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <title>Factorizando</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
