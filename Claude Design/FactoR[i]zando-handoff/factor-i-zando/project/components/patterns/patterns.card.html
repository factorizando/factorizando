<!-- @dsCard group="Components" viewport="700x340" subtitle="Tarjeta de materia del catálogo" name="Patrones" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../_fx_loader.js"></script>
<style>body{margin:0;padding:20px;background:var(--fx-bg);font-family:var(--fx-font-body)}
.grp{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lbl{font-family:var(--fx-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fx-text-muted)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
window.fxLoadBundle('../../_ds_bundle.js')
  .then(function () { return window.fxComponents('../', [{"name":"SubjectCard","path":"patterns/SubjectCard.jsx"},{"name":"Card","path":"core/Card.jsx"}]); })
  .then(function (NS) {
const { SubjectCard, Card } = NS;

const MarkQ = () => <span style={{ width: 22, height: 22, borderRadius: '4px 999px 999px 999px', background: 'var(--fx-coral)' }} />;
const MarkM = () => <span style={{ fontFamily: 'var(--fx-font-mono)', fontSize: 20, color: 'var(--fx-math)' }}>×</span>;
function Demo() {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20 }}>
      <SubjectCard subject="math" icon={<MarkM />} title="Matemáticas" meta="14 unidades · 312 ejercicios"
        description="Aritmética, álgebra y geometría con pizarras donde el resultado cambia mientras lo resuelves." />
      <SubjectCard subject="coral" icon={<MarkQ />} title="Química" meta="9 unidades · 176 ejercicios"
        description="Laboratorio virtual: mezcla disoluciones, mide el pH y balancea ecuaciones." />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  })
  .catch(function (e) { document.getElementById('root').textContent = 'ERR: ' + (e && e.stack || e); });
</script></body></html>
