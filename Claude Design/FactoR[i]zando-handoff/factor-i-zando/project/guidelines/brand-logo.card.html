<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--fx-bg); font-family:var(--fx-font-body); color:var(--fx-text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:64px; border-radius:12px; border:1px solid var(--fx-border); }
  .lbl { font-family:var(--fx-font-mono); font-size:10px; color:var(--fx-text-muted); }
  .nm { font-size:12px; font-weight:600; color:var(--fx-text-heading); }
</style></head>
<body><div class="row" style="align-items:center;gap:28px">
<div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;border-radius:9px;background:var(--fx-primary-500);display:grid;place-items:center;color:#fff;font-family:var(--fx-font-heading);font-weight:700;font-size:16px">F</span><span style="font-family:var(--fx-font-heading);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--fx-text-heading)">FactoR<span style="font-family:var(--fx-font-math);color:var(--fx-primary-500)">[<em>i</em>]</span>zando</span></div>
<div style="display:flex;align-items:center;gap:10px;background:var(--fx-primary-900);padding:10px 16px;border-radius:12px"><span style="width:28px;height:28px;border-radius:8px;background:#fff;display:grid;place-items:center;color:var(--fx-primary-900);font-family:var(--fx-font-heading);font-weight:700;font-size:14px">F</span><span style="font-family:var(--fx-font-heading);font-weight:600;font-size:17px;color:#fff">FactoR<span style="font-family:var(--fx-font-math);color:var(--fx-primary-300)">[<em>i</em>]</span>zando</span></div>
</div></body></html>
