<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--fx-bg); font-family:var(--fx-font-body); color:var(--fx-text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:64px; border-radius:12px; border:1px solid var(--fx-border); }
  .lbl { font-family:var(--fx-font-mono); font-size:10px; color:var(--fx-text-muted); }
  .nm { font-size:12px; font-weight:600; color:var(--fx-text-heading); }
</style></head>
<body><div class="row"><div class="sw" style="align-items:center"><div style="width:52px;height:52px;border-radius:14px;background:#EEF4FE;display:grid;place-items:center"><span style="font-family:var(--fx-font-mono);font-size:20px;color:#0056D2">×</span></div><span class="lbl">Matemáticas</span></div><div class="sw" style="align-items:center"><div style="width:52px;height:52px;border-radius:14px;background:#EDF5F1;display:grid;place-items:center"><span style="width:20px;height:20px;border-radius:999px 4px 999px 4px;background:#4F9377"></span></div><span class="lbl">Biología</span></div><div class="sw" style="align-items:center"><div style="width:52px;height:52px;border-radius:14px;background:#FBEEEA;display:grid;place-items:center"><span style="width:22px;height:22px;border-radius:4px 999px 999px 999px;background:#DE6E55"></span></div><span class="lbl">Química</span></div><div class="sw" style="align-items:center"><div style="width:52px;height:52px;border-radius:14px;background:#FBF3E5;display:grid;place-items:center"><span style="width:22px;height:4px;border-radius:999px;background:#D2942E;box-shadow:0 7px 0 #D2942E,0 -7px 0 #E8BE7A"></span></div><span class="lbl">Historia</span></div><div class="sw" style="align-items:center"><div style="width:52px;height:52px;border-radius:14px;background:#EDF5F1;display:grid;place-items:center"><span style="width:22px;height:22px;border-radius:999px;border:4px solid #4F9377"></span></div><span class="lbl">Geografía</span></div><div class="sw" style="align-items:center"><div style="width:52px;height:52px;border-radius:14px;background:#F0EFF8;display:grid;place-items:center"><span style="display:flex;align-items:flex-end;gap:3px;height:22px"><span style="width:4px;height:10px;border-radius:999px;background:#6C63B5"></span><span style="width:4px;height:22px;border-radius:999px;background:#6C63B5"></span><span style="width:4px;height:15px;border-radius:999px;background:#A9A3D8"></span></span></div><span class="lbl">Física / Música</span></div></div></body></html>
