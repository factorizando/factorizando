<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--fx-bg); font-family:var(--fx-font-body); color:var(--fx-text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:64px; border-radius:12px; border:1px solid var(--fx-border); }
  .lbl { font-family:var(--fx-font-mono); font-size:10px; color:var(--fx-text-muted); }
  .nm { font-size:12px; font-weight:600; color:var(--fx-text-heading); }
</style></head>
<body><div class="row"><div class="sw" style="flex:1"><div class="chip" style="background:#0056D2"></div><div class="chip" style="height:26px;background:#EEF4FE"></div><span class="nm">Matemáticas</span><span class="lbl">#0056D2</span></div><div class="sw" style="flex:1"><div class="chip" style="background:#4F9377"></div><div class="chip" style="height:26px;background:#EDF5F1"></div><span class="nm">Bio / Geo</span><span class="lbl">#4F9377</span></div><div class="sw" style="flex:1"><div class="chip" style="background:#DE6E55"></div><div class="chip" style="height:26px;background:#FBEEEA"></div><span class="nm">Química</span><span class="lbl">#DE6E55</span></div><div class="sw" style="flex:1"><div class="chip" style="background:#D2942E"></div><div class="chip" style="height:26px;background:#FBF3E5"></div><span class="nm">Historia</span><span class="lbl">#D2942E</span></div><div class="sw" style="flex:1"><div class="chip" style="background:#6C63B5"></div><div class="chip" style="height:26px;background:#F0EFF8"></div><span class="nm">Física / Música</span><span class="lbl">#6C63B5</span></div></div></body></html>
