<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../_fx_loader.js"></script>
<style>body{margin:0;padding:20px;background:var(--fx-bg);font-family:var(--fx-font-body)}
.grp{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.lbl{font-family:var(--fx-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fx-text-muted)}</style>
</head><body><div id="root"></div>
<script type="text/babel" data-presets="react">
window.fxLoadBundle('../../_ds_bundle.js')
  .then(function () { return window.fxComponents('../', [{"name":"Alert","path":"feedback/Alert.jsx"}]); })
  .then(function (NS) {
const { Alert } = NS;

function Demo() {
  return (
    <div className="grp">
      <Alert tone="success" title="¡Correcto!">24 = 2³ × 3. Pasa a la siguiente rama.</Alert>
      <Alert tone="warning" title="Te queda un intento">Revisa el exponente antes de enviar.</Alert>
      <Alert tone="error" title="Respuesta incorrecta">El 9 no es primo: sigue descomponiéndolo.</Alert>
      <Alert tone="info" title="Modo práctica">Este ejercicio no cuenta para tu calificación.</Alert>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  })
  .catch(function (e) { document.getElementById('root').textContent = 'ERR: ' + (e && e.stack || e); });
</script></body></html>
