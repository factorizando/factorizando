<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--fx-bg); font-family:var(--fx-font-body); color:var(--fx-text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:64px; border-radius:12px; border:1px solid var(--fx-border); }
  .lbl { font-family:var(--fx-font-mono); font-size:10px; color:var(--fx-text-muted); }
  .nm { font-size:12px; font-weight:600; color:var(--fx-text-heading); }
</style></head>
<body><div style="display:flex;flex-direction:column;gap:14px">
<span style="font-family:var(--fx-font-heading);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--fx-text-heading)">0123456789</span>
<div style="background:var(--fx-surface);border:1px solid var(--fx-border);border-radius:12px;padding:14px;display:flex;gap:24px;flex-wrap:wrap;font-family:var(--fx-font-mono);font-size:17px;color:var(--fx-text-heading)"><span>24 = 2³ × 3</span><span>v = λ · f</span><span>pH = −log[H⁺]</span></div>
</div></body></html>
