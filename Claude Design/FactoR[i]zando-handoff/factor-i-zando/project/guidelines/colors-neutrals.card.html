<!-- @dsCard group="Colors" viewport="700x150" subtitle="Grises con matiz azul-verde, no gris puro" name="Neutros cálidos" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--fx-bg); font-family:var(--fx-font-body); color:var(--fx-text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:64px; border-radius:12px; border:1px solid var(--fx-border); }
  .lbl { font-family:var(--fx-font-mono); font-size:10px; color:var(--fx-text-muted); }
  .nm { font-size:12px; font-weight:600; color:var(--fx-text-heading); }
</style></head>
<body><div class="row"><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#FFFFFF"></div><span class="nm">surface</span><span class="lbl">#FFFFFF</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#F7F9FC"></div><span class="nm">bg</span><span class="lbl">#F7F9FC</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#EFF3F9"></div><span class="nm">sunken</span><span class="lbl">#EFF3F9</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#E3E9F2"></div><span class="nm">border</span><span class="lbl">#E3E9F2</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#CDD8E6"></div><span class="nm">border-strong</span><span class="lbl">#CDD8E6</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#5A6B7F"></div><span class="nm">text-muted</span><span class="lbl">#5A6B7F</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#33475B"></div><span class="nm">text-body</span><span class="lbl">#33475B</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#0A2540"></div><span class="nm">text-heading</span><span class="lbl">#0A2540</span></div></div></body></html>
