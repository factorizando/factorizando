<!-- @dsCard group="Colors" viewport="700x150" subtitle="Escala 50–900; 500 es el color de acción" name="Azul primario" -->
<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--fx-bg); font-family:var(--fx-font-body); color:var(--fx-text-body); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:64px; border-radius:12px; border:1px solid var(--fx-border); }
  .lbl { font-family:var(--fx-font-mono); font-size:10px; color:var(--fx-text-muted); }
  .nm { font-size:12px; font-weight:600; color:var(--fx-text-heading); }
</style></head>
<body><div class="row"><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#EEF4FE"></div><span class="nm">50</span><span class="lbl">#EEF4FE</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#D7E5FC"></div><span class="nm">100</span><span class="lbl">#D7E5FC</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#B4CDF8"></div><span class="nm">200</span><span class="lbl">#B4CDF8</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#85AEF1"></div><span class="nm">300</span><span class="lbl">#85AEF1</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#3F80E5"></div><span class="nm">400</span><span class="lbl">#3F80E5</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#0056D2"></div><span class="nm">500</span><span class="lbl">#0056D2</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#0047AF"></div><span class="nm">600</span><span class="lbl">#0047AF</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#003A8F"></div><span class="nm">700</span><span class="lbl">#003A8F</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#082F6C"></div><span class="nm">800</span><span class="lbl">#082F6C</span></div><div class="sw" style="flex:1 1 0"><div class="chip" style="background:#0A2540"></div><span class="nm">900</span><span class="lbl">#0A2540</span></div></div></body></html>
